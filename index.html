<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'unsafe-inline'; connect-src https://numuklpdlzkzkkxwhlqe.supabase.co; img-src 'self' data:; base-uri 'none'; form-action 'self'">
    <title>重置密码 - 铁城中学日常管理工具</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #243447;
            background: linear-gradient(135deg, #4a90d9 0%, #285f9d 100%);
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }
        .card {
            width: 100%;
            max-width: 440px;
            padding: 38px 34px;
            border-radius: 14px;
            background: #fff;
            box-shadow: 0 16px 48px rgba(15, 40, 70, 0.24);
        }
        h1 { margin: 0 0 8px; text-align: center; font-size: 24px; }
        .subtitle { margin: 0 0 28px; text-align: center; color: #718096; font-size: 13px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 7px; font-size: 14px; font-weight: 600; }
        input {
            width: 100%;
            height: 46px;
            padding: 0 13px;
            border: 1px solid #cfd8e3;
            border-radius: 7px;
            font: inherit;
            outline: none;
        }
        input:focus { border-color: #377fc4; box-shadow: 0 0 0 3px rgba(55, 127, 196, 0.14); }
        button {
            width: 100%;
            height: 46px;
            border: 0;
            border-radius: 7px;
            color: #fff;
            background: #377fc4;
            font: 600 15px inherit;
            cursor: pointer;
        }
        button:hover { background: #286aa9; }
        button:disabled { background: #aeb9c5; cursor: not-allowed; }
        .hint { margin-top: 7px; color: #718096; font-size: 12px; line-height: 1.6; }
        .status { padding: 18px 0; text-align: center; color: #65758b; font-size: 14px; }
        .message { display: none; margin-bottom: 18px; padding: 12px 14px; border-radius: 7px; font-size: 13px; line-height: 1.6; }
        .message.error { display: block; color: #a52828; background: #fff0f0; border: 1px solid #f0b6b6; }
        .message.success { display: block; color: #176b3a; background: #edf9f1; border: 1px solid #acdabb; }
        .done { text-align: center; padding: 12px 0 4px; }
        .done-icon { margin-bottom: 12px; font-size: 46px; }
        .done-title { margin-bottom: 8px; font-size: 18px; font-weight: 600; }
        .done-text { color: #718096; font-size: 13px; line-height: 1.7; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <main class="card">
        <h1>重置密码</h1>
        <p class="subtitle">铁城中学日常管理工具</p>
        <div id="message" class="message" role="alert" aria-live="polite"></div>
        <div id="loading" class="status">正在验证重置链接，请稍候……</div>
        <form id="resetForm" class="hidden" novalidate>
            <div class="form-group">
                <label for="newPassword">新密码</label>
                <input type="password" id="newPassword" autocomplete="new-password" required minlength="8">
                <div class="hint">至少 8 位，并同时包含大写字母、小写字母、数字和特殊字符。</div>
            </div>
            <div class="form-group">
                <label for="confirmPassword">确认新密码</label>
                <input type="password" id="confirmPassword" autocomplete="new-password" required minlength="8">
            </div>
            <button type="submit" id="submitBtn">确认重置</button>
        </form>
        <section id="doneMessage" class="done hidden" aria-live="polite">
            <div class="done-icon">✅</div>
            <div class="done-title">密码重置成功</div>
            <div class="done-text">本次恢复会话已安全退出。请关闭此页面，返回工具并使用新密码登录。</div>
        </section>
    </main>

    <script src="./app.js?v=20260917-token-hash"></script>
</body>
</html>
